name: Watch MekHQ releases

# Polls MegaMek/mekhq for a new release and auto-dispatches build.yml so a
# fresh MekHQ never needs a manual build. MegaMek, MekHQ and MegaMekLab ship
# in lockstep, so the MekHQ tag IS the MegaMek version (this flatpak packages
# MekHQ, which bundles all three).
#
# State is a git tag `mekhq-built-<version>` that build.yml's record-version
# job creates ONLY after a successful build+deploy. (We can't commit a marker
# to main — a ruleset requires PRs — and tags sidestep that.) A failed build
# creates no tag, so this watcher simply re-dispatches next run; no stuck
# "already tried" state.

on:
  schedule:
    - cron: '0 8 * * *'   # daily 08:00 UTC
  workflow_dispatch: {}    # manual "check now"

permissions:
  contents: read           # read tags + MekHQ releases
  actions: write           # dispatch build.yml

jobs:
  check:
    name: Dispatch build on new MekHQ release
    runs-on: ubuntu-latest
    steps:
      - name: Compare latest release against built tags
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          latest="$(gh api repos/MegaMek/mekhq/releases/latest -q .tag_name)"
          latest="${latest#v}"                         # strip leading v
          if gh api "repos/${REPO}/git/ref/tags/mekhq-built-${latest}" >/dev/null 2>&1; then
            echo "MekHQ ${latest} already built (tag mekhq-built-${latest} exists) — nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "MekHQ ${latest} not yet built — will dispatch"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch flatpak build
        if: steps.compare.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dispatching build.yml for MekHQ ${{ steps.compare.outputs.latest }}"
          gh workflow run build.yml -f version="${{ steps.compare.outputs.latest }}"
