name: record-version token check

# record-version (build.yml) writes the mekhq-built-<version> tag that
# watch-upstream.yml reads as "already built". That write only happens when a
# new MekHQ version ships, so a broken credential would surface months later,
# mid-release (#22). This mints the SAME token -- CICD App, contents: write --
# and makes the SAME call with it: POST /git/refs for a tag, whenever the job
# that uses it changes. A read only proves the token can SEE refs; the 403 in
# #22 was on the create. The scratch tag (token-check-<run>-<attempt>) points
# at main's head and is deleted at once, trap-guarded. No workflow triggers on
# tags, so it starts nothing.

on:
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/record-version-token.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  token:
    runs-on: flatpak-repo-runner
    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ env.CICD_APP_CLIENT_ID }}
          private-key: ${{ env.CICD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: flatpak-repo
          permission-contents: write

      - name: The token can create and delete a tag ref (the call record-version makes)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: token-check-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/git/matching-refs/tags/mekhq-built" --jq '.[].ref'
          sha=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          cleanup() { gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${sha}" --jq .ref
          gh api -X DELETE "repos/${REPO}/git/refs/tags/${TAG}"
          if gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::scratch tag ${TAG} still exists after DELETE"; exit 1
          fi
          trap - EXIT
          echo "RECORD-VERSION-TOKEN-OK created+deleted ${TAG}"
