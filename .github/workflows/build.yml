name: Build and Publish Flatpak

on:
  push:
    branches: [ main ]
    # Named explicitly rather than by glob. '**.json' also matched
    # renovate.json, so adding a dependency-bot config on 2026-07-31 triggered
    # a full publish of the flatpak — a file with no bearing on the bundle
    # republishing the application.
    paths:
      - 'com.megamek.mekhq.json'
      - 'com.megamek.mekhq.metainfo.xml'
      - 'com.megamek.mekhq.desktop'
      - 'mekhq-wrapper.sh'
      - 'mekhq.png'
      - 'index.html'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'MekHQ version to build, without the v prefix (e.g. 0.51.0)'
        required: true
        # No default. A prefilled version is a version someone can publish by
        # accident, and this input publishes over whatever is live.

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Resolved before the build, on a runner that has `gh`, so the version comes
  # from a real source instead of a literal baked into the workflow.
  #
  # A push-triggered rebuild carries no dispatch input. It used to fall back to
  # a hardcoded '0.50.11', so any push touching a matched path republished that
  # exact version over whatever was live. On 2026-07-31 a commit adding
  # renovate.json did exactly that, downgrading the published flatpak from
  # 0.51.0 to 0.50.11, where it stayed for 40 days.
  #
  # The mekhq-built-<version> tags already record what has been built, so a
  # rebuild republishes the version that is current rather than inventing one.
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve MekHQ version to build
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          source="workflow_dispatch input"

          if [ -z "$version" ]; then
            source="latest mekhq-built-* tag"
            version="$(gh api "repos/${REPO}/git/matching-refs/tags/mekhq-built-" \
              --jq '.[].ref | sub("^refs/tags/mekhq-built-"; "")' \
              | sort -V | tail -1)"
          fi

          version="${version#v}"

          # No input and no tag leaves no defensible answer. Guessing one is
          # what published the wrong build for 40 days, so stop instead: an
          # unbuilt repo is recoverable, a silent downgrade of a live artifact
          # is not.
          if [ -z "$version" ]; then
            echo "::error::Cannot determine which MekHQ version to build: no workflow_dispatch input and no mekhq-built-* tag exists. Dispatch this workflow with an explicit version."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building MekHQ v${version} (from ${source})"

  build:
    needs: resolve-version
    runs-on: flatpak-repo-runner
    outputs:
      version: ${{ steps.version.outputs.version }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      -         uses: actions/checkout@v7

      - name: Set version
        id: version
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          # Strip leading 'v' if someone included it
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Building MekHQ v${VERSION}"

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          env-slug: prod
          project-slug: homelab-bz-gt
          secret-path: /
          export-type: env
          domain: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080

      - name: Cache MekHQ tarball
        id: cache-tarball
        uses: actions/cache@v6.1.0
        with:
          path: mekhq.tar.gz
          key: mekhq-tarball-${{ steps.version.outputs.version }}

      - name: Configure AWS CLI for R2
        run: |
          # Retried: one Fastly edge node in PyPI's rotation serves 502s to this
          # cluster at ~15% (homelab#1029). pip's own retries reuse the
          # connection and land back on the same node; a fresh process
          # re-resolves, so three attempts take ~15% to ~0.3%.
          for attempt in 1 2 3; do
            pip install awscli && break
            [ "$attempt" = 3 ] && { echo "::error::pip install failed three times"; exit 1; }
            echo "::warning::pip install failed (attempt ${attempt}/3) — retrying"
            sleep $((attempt * 10))
          done
          aws configure set aws_access_key_id $FP_R2_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $FP_R2_SECRET_ACCESS_KEY
          aws configure set region auto
          aws configure set output json

      - name: Download MekHQ tarball from R2
        id: download-tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE_NAME="MekHQ-${VERSION}.tar.gz"
          OBJECT_KEY="mekhq/${BUNDLE_NAME}"
          
          ENDPOINT="https://${FP_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if aws --endpoint-url "$ENDPOINT" s3 cp s3://${FP_R2_BUCKET_NAME}/${OBJECT_KEY} mekhq.tar.gz 2>/dev/null; then
            echo "✓ Downloaded ${OBJECT_KEY} from R2"
          else
            echo "File not found in R2, downloading from GitHub releases"
            curl -L -o mekhq.tar.gz "https://github.com/MegaMek/mekhq/releases/download/v${VERSION}/MekHQ-${VERSION}.tar.gz"
            aws --endpoint-url "$ENDPOINT" s3 cp mekhq.tar.gz s3://${FP_R2_BUCKET_NAME}/${OBJECT_KEY}
            echo "✓ Uploaded ${OBJECT_KEY} to R2"
          fi
          ls -lh mekhq.tar.gz

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: mekhq-${{ steps.version.outputs.version_tag }}.flatpak
          manifest-path: com.megamek.mekhq.json
          cache-key: flatpak-builder-${{ hashFiles('com.megamek.mekhq.json', 'mekhq-wrapper.sh') }}

      - name: Upload flatpak to R2
        run: |
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"
          BUNDLE_NAME="mekhq-${VERSION_TAG}.flatpak"
          
          aws --endpoint-url https://${FP_R2_ACCOUNT_ID}.r2.cloudflarestorage.com s3 cp ${BUNDLE_NAME} s3://${FP_R2_BUCKET_NAME}/flatpak/${BUNDLE_NAME}
          aws --endpoint-url https://${FP_R2_ACCOUNT_ID}.r2.cloudflarestorage.com s3 cp ${BUNDLE_NAME} s3://${FP_R2_BUCKET_NAME}/flatpak/mekhq-latest.flatpak
          
           echo "Uploaded ${BUNDLE_NAME} to R2"

      - name: Generate .flatpakrepo file
        run: |
          cat > mekhq.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=MekHQ Flatpak Repository
          Url=https://dvystrcil.github.io/flatpak-repo/repo/
          Homepage=https://github.com/dvystrcil/flatpak-repo
          Description=Self-hosted MekHQ Flatpak repository (testing)
          DefaultBranch=master
          EOF

      - name: Prepare Pages directory
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_TAG="${{ steps.version.outputs.version_tag }}"
          BUNDLE_NAME="mekhq-${VERSION_TAG}.flatpak"

          mkdir -p pages-deploy
          cp -r repo pages-deploy/repo
          cp mekhq.flatpakrepo pages-deploy/
          cp "${BUNDLE_NAME}" pages-deploy/

          # Stable "latest" filename for predictable URL
          cp "${BUNDLE_NAME}" "pages-deploy/mekhq-latest.flatpak"

          # Substitute version placeholders in the index.html
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__VERSION_TAG__|${VERSION_TAG}|g" \
              -e "s|__BUNDLE_NAME__|${BUNDLE_NAME}|g" \
              index.html > pages-deploy/index.html

          ls -la pages-deploy/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: pages-deploy

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mekhq-flatpak-${{ steps.version.outputs.version_tag }}
          path: mekhq-${{ steps.version.outputs.version_tag }}.flatpak
          retention-days: 5

  deploy:
    needs: build
    runs-on: flatpak-repo-runner
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  # Records the version we just shipped (a git tag `mekhq-built-<version>`) so
  # watch-upstream.yml knows not to re-dispatch it. Runs only after build+deploy
  # succeed, so the tag marks the last *successfully published* version — a
  # failed build creates no tag and the watcher retries. A tag is used rather
  # than a commit because main requires PRs (ruleset); tags are unrestricted.
  record-version:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag published MekHQ version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="mekhq-built-${VERSION}"
          if gh api "repos/${REPO}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — nothing to do"
            exit 0
          fi
          gh api -X POST "repos/${REPO}/git/refs" \
            -f ref="refs/tags/${tag}" -f sha="${SHA}"
          echo "Tagged ${tag}"
