name: watch-upstream dispatch check

# watch-upstream.yml's dispatch step only runs on the day a new stable MekHQ
# ships, so a broken dispatch surfaces mid-release, not when the watcher is
# edited. It did (homelab#1841): 0.51.00.2 shipped 2026-10-28 and the step
# died three days running with
#   failed to run git: fatal: not a git repository
# because the job never checks out the repo and `gh workflow run` had no
# --repo/GH_REPO, so gh fell back to asking git which repo it was in.
#
# This runs on any change to the watcher and:
#   1. asserts the watcher job still sets GH_REPO and still has no checkout
#      (the conditions the bug depended on, read from the real file), and
#   2. in a job shaped the same (no checkout), proves gh resolves the repo
#      from GH_REPO with `gh workflow view build.yml`: the same repo
#      resolution `gh workflow run` does, without dispatching a real build.
#   3. negative control: the same call WITHOUT GH_REPO must fail the way the
#      watcher did, or this check can't tell a fixed watcher from a broken one.

on:
  pull_request:
    paths:
      - '.github/workflows/watch-upstream.yml'
      - '.github/workflows/watch-upstream-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dispatch-resolves-repo:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # No actions/checkout on purpose: the watcher has none either. The
      # watcher file is fetched over the API from the PR head instead.
      - name: Watcher sets GH_REPO at job level and has no checkout
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/contents/.github/workflows/watch-upstream.yml?ref=${REF}" \
            --jq .content | base64 -d > "${RUNNER_TEMP}/watch-upstream.yml"
          python3 - "${RUNNER_TEMP}/watch-upstream.yml" <<'EOF'
          import sys, yaml
          wf = yaml.safe_load(open(sys.argv[1]))
          job = wf["jobs"]["check"]
          env = job.get("env", {})
          # Assembled so Actions doesn't expand the expression in this script.
          want = "$" + "{{ github.repository }}"
          assert env.get("GH_REPO") == want, \
              f"watcher job env must set GH_REPO: {want}, got {env!r}"
          uses = [s.get("uses", "") for s in job["steps"]]
          assert not any(u.startswith("actions/checkout") for u in uses), \
              "watcher now checks out the repo; this check's no-checkout model is stale"
          print("ok: watcher job sets GH_REPO and has no checkout")
          EOF

      - name: gh resolves build.yml from GH_REPO with no git repo
        run: |
          set -euo pipefail
          ! git rev-parse --git-dir 2>/dev/null || { echo "unexpected git repo in cwd"; exit 1; }
          gh workflow view build.yml >/dev/null
          echo "ok: gh workflow resolved build.yml via GH_REPO"

      - name: Negative control - without GH_REPO it fails like homelab#1841
        run: |
          # Actions runs steps with bash -e; capture the expected failure
          # instead of letting it end the step.
          out=$(env -u GH_REPO gh workflow view build.yml 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ] || ! grep -q 'not a git repository' <<<"$out"; then
            echo "control did not reproduce the failure; check can't discriminate"; exit 1
          fi
          echo "ok: control reproduces the original failure"
